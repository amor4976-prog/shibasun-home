name: 予約サイト・空き枠の外部監視

on:
  schedule:
    - cron: '7 */3 * * *'
  workflow_dispatch:
    inputs:
      notification_test:
        description: 'Send a clearly labelled notification test (no site failure)'
        type: boolean
        default: false

permissions:
  contents: write
  issues: write

concurrency:
  group: booking-health
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Check public booking endpoints and notify on state changes
        env:
          GH_TOKEN: ${{ github.token }}
          NOTIFICATION_TEST: ${{ inputs.notification_test || false }}
        run: python3 .github/monitor/booking_health.py
      - name: Keep scheduled monitoring active during long periods without site edits
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 .github/monitor/keep_active.py
