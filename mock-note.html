<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#ffffff">
<title>タスクノート</title>
</head>
<body>
<style>
  /* 白基調でひとつに決め打ち（シバグラム本体と同じ見た目に合わせる） */
  :root{
    --ji:#f4f3f0;      /* 地 */
    --kami:#ffffff;    /* 紙 */
    --sumi:#1e1d1a;    /* 墨 */
    --sumi-yowa:#57544e;
    --usu:#8d8981;
    --kei:#e4e1da;
    --kin:#a07733;
    --kin-usu:#f6f1e6;
    --maru:12px; --w:460px;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0; background:var(--ji); color:var(--sumi);
    font-family:"Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP",system-ui,sans-serif;
    -webkit-font-smoothing:antialiased; line-height:1.75;
    font-feature-settings:"palt" 1;
    -webkit-text-size-adjust:100%;
  }
  .app{
    max-width:var(--w); margin:0 auto; min-height:100dvh;
    display:flex; flex-direction:column; background:var(--kami);
  }
  @media(min-width:900px){
    .app{margin:24px auto; height:calc(100vh - 48px); min-height:0;
      border-radius:22px; overflow:hidden; box-shadow:0 20px 50px rgba(0,0,0,.10)}
  }

  /* 帯とタブ */
  .obi{background:var(--kami); border-bottom:1px solid var(--kei)}
  .obi .ue{display:flex; align-items:baseline; gap:10px; padding:16px 18px 12px}
  .obi h1{font-size:16.5px; font-weight:600; margin:0; letter-spacing:.04em}
  .obi .hi{margin-left:auto; font-size:12px; color:var(--usu); font-variant-numeric:tabular-nums}
  .kirikae{display:flex; padding:0 10px}
  .kirikae button{
    flex:1; border:0; background:transparent; font:inherit; font-size:15px; cursor:pointer;
    color:var(--usu); padding:10px 4px 12px; position:relative; letter-spacing:.04em;
    display:flex; align-items:center; justify-content:center; gap:8px;
  }
  .kirikae button::after{
    content:""; position:absolute; left:10px; right:10px; bottom:0; height:2.5px;
    background:transparent; border-radius:2px; transition:background .18s;
  }
  .kirikae button[aria-selected="true"]{color:var(--sumi); font-weight:600}
  .kirikae button[aria-selected="true"]::after{background:var(--kin)}
  .kirikae .kazu{
    font-size:11.5px; font-variant-numeric:tabular-nums; color:#fff;
    background:var(--kin); border-radius:999px; padding:1px 8px; letter-spacing:0; font-weight:600;
  }
  .kirikae .kazu[data-zero="1"]{background:var(--kei); color:var(--usu)}

  .men{flex:1; display:flex; flex-direction:column; min-height:0}
  .men[hidden]{display:none}

  /* 画面1：マイチャット（チャットワークと同じ並び方） */
  .nagare{
    flex:1; overflow-y:auto; background:var(--kami);
    padding:6px 0 12px;
  }
  .fuda{
    padding:15px 18px 16px; border-bottom:1px solid var(--kei);
    animation:ukabu .28s cubic-bezier(.2,.8,.3,1) both;
  }
  @keyframes ukabu{from{opacity:0; transform:translateY(6px)} to{opacity:1; transform:none}}
  @media (prefers-reduced-motion:reduce){.fuda{animation:none}}
  .fuda .toki{font-size:11.5px; color:var(--usu); font-variant-numeric:tabular-nums; letter-spacing:.06em}
  .fuda .hon{margin-top:5px; font-size:17px; line-height:1.9; white-space:pre-wrap; overflow-wrap:anywhere}
  .ashi{
    margin-top:9px; font-size:12.5px; color:var(--usu);
    display:flex; align-items:center; gap:8px;
  }
  .ashi button{
    border:0; background:transparent; font:inherit; font-size:12.5px; color:var(--kin);
    cursor:pointer; padding:0; text-decoration:underline; text-underline-offset:3px;
  }
  .ashi .tama{width:5px; height:5px; border-radius:50%; background:var(--kin); animation:matataki 1.1s ease-in-out infinite}
  @keyframes matataki{0%,100%{opacity:.25}50%{opacity:1}}

  /* 書く場所 */
  .kaku{position:sticky; bottom:0; background:var(--kami); border-top:1px solid var(--kei); padding:11px 12px 14px}
  .kaku .waku{
    display:flex; align-items:flex-end; gap:9px; background:var(--ji);
    border:1px solid var(--kei); border-radius:var(--maru); padding:6px 6px 6px 13px; transition:border-color .18s;
  }
  .kaku .waku:focus-within{border-color:var(--kin)}
  #memo{
    flex:1; border:0; background:transparent; color:inherit; font:inherit; font-size:17px;
    line-height:1.8; resize:none; outline:none; padding:7px 0; max-height:190px; min-height:36px;
  }
  #memo::placeholder{color:var(--usu)}
  .okuru{
    flex:none; border:0; border-radius:10px; cursor:pointer; background:var(--sumi); color:#fff;
    font:inherit; font-size:14px; font-weight:600; padding:10px 18px; letter-spacing:.08em; transition:opacity .15s;
  }
  .okuru:disabled{opacity:.22; cursor:default}

  /* 画面2：やること */
  .yaruba{flex:1; overflow-y:auto; padding:14px 14px 28px; background:var(--ji)}
  .kumi{background:var(--kami); border:1px solid var(--kei); border-radius:var(--maru); margin-bottom:12px; overflow:hidden}
  .kumi .kashira{
    display:flex; align-items:baseline; gap:9px; padding:11px 15px 10px;
    background:var(--kin-usu); border-bottom:1px solid var(--kei);
  }
  .kumi .kashira b{font-size:15px; font-weight:600; letter-spacing:.02em}
  .kumi .kashira .doko{font-size:11.5px; color:var(--kin)}
  .kumi .kashira .nan{margin-left:auto; font-size:11.5px; color:var(--usu); font-variant-numeric:tabular-nums}
  .yaru{display:flex; align-items:flex-start; gap:11px; padding:13px 15px; cursor:pointer; border-bottom:1px solid var(--kei)}
  .yaru:last-child{border-bottom:0}
  .yaru:active{background:var(--ji)}
  .yaru .box{
    flex:none; width:20px; height:20px; margin-top:2px; border-radius:4px;
    border:1.5px solid var(--kin); position:relative; transition:.15s; background:var(--kami);
  }
  .yaru.sumi .box{background:var(--kin)}
  .yaru.sumi .box::after{
    content:""; position:absolute; left:6px; top:2.5px; width:5px; height:10px;
    border:solid #fff; border-width:0 2px 2px 0; transform:rotate(42deg);
  }
  .yaru .naka{min-width:0}
  .yaru .mo{font-size:16px; line-height:1.7}
  .yaru.sumi .mo{color:var(--usu); text-decoration:line-through; text-decoration-thickness:1px}
  .yaru .moto{font-size:11.5px; color:var(--usu); margin-top:4px; font-variant-numeric:tabular-nums}
  .karappo{padding:52px 20px; text-align:center; color:var(--usu); font-size:14px; line-height:2}
</style>

<div class="app">
  <div class="obi">
    <div class="ue">
      <h1>タスクノート</h1>
      <div class="hi" id="kyou"></div>
    </div>
    <div class="kirikae" role="tablist">
      <button id="tab-memo" role="tab" aria-selected="true" type="button">マイチャット</button>
      <button id="tab-yaru" role="tab" aria-selected="false" type="button">やること<span class="kazu" id="kazu">0</span></button>
    </div>
  </div>

  <div class="men" id="men-memo">
    <div class="nagare" id="nagare"></div>
    <div class="kaku">
      <div class="waku">
        <textarea id="memo" rows="1" placeholder="いつも通り、まとめて書いてください"></textarea>
        <button class="okuru" id="okuru" type="button" disabled>入れる</button>
      </div>
    </div>
  </div>

  <div class="men" id="men-yaru" hidden>
    <div class="yaruba" id="yaruba"></div>
  </div>
</div>

<script>
  const $=(s)=>document.querySelector(s);
  const memo=$('#memo'), okuru=$('#okuru'), nagare=$('#nagare'), yaruba=$('#yaruba'), kazu=$('#kazu');
  const tabMemo=$('#tab-memo'), tabYaru=$('#tab-yaru'), menMemo=$('#men-memo'), menYaru=$('#men-yaru');
  const KEY='shibagram-note-mock-v4';

  const hm=(d)=>String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0');
  $('#kyou').textContent=(()=>{const d=new Date(),w='日月火水木金土'[d.getDay()];
    return `${d.getMonth()+1}月${d.getDate()}日（${w}）`})();

  const KYAKU=['岡本','今井','中井','狩野','松井','中村','川本','永吉','大西'];
  const GYOSHA={'中本':'NT WELD','横田':'住設','山岡':'ルームワン','柴山':'大工','岩井':'あをによし'};

  function yomu(text, toki){
    const lines=text.split('\n').map(s=>s.trim()).filter(Boolean);
    const out=[]; let genba=null, hizuke=null;
    lines.forEach((line,i)=>{
      const m=line.match(/(\d{1,2})月(\d{1,2})日/);
      const kName=KYAKU.find(n=>line.includes(n));
      const midashi = i===0 && (m || (kName && line.includes('邸'))) && line.length<26;
      if(midashi){
        if(m) hizuke=`${+m[1]}月${+m[2]}日`;
        if(kName) genba=kName+'様邸';
        return;
      }
      const k=KYAKU.find(n=>line.includes(n));
      const g=Object.keys(GYOSHA).find(n=>line.includes(n+'様')||line.includes(n+'さん'));
      out.push({mo:line, sumi:false, toki,
        saki: k?(k+'様'):(g?(g+'様'):(genba||'その他')),
        shubetsu: k?'お客様':(g?GYOSHA[g]:(genba?'現場':'')),
        hizuke});
    });
    return out;
  }

  let items=JSON.parse(localStorage.getItem(KEY)||'null');
  if(!items){
    const s='9月5日岡本様邸　中本様\n\nクレヴィ　施工説明書\n今井様の持ち込み品リスト確認';
    items=[{t:'17:42', s, y:yomu(s,'17:42'), machi:false}];
  }
  const save=()=>localStorage.setItem(KEY,JSON.stringify(items));
  const zenbu=()=>items.flatMap(it=>it.y||[]);

  function drawChat(){
    nagare.innerHTML='';
    items.forEach(it=>{
      const box=document.createElement('div'); box.className='fuda';
      const toki=document.createElement('div'); toki.className='toki'; toki.textContent=it.t;
      const hon=document.createElement('div'); hon.className='hon'; hon.textContent=it.s;
      box.append(toki,hon);
      const ashi=document.createElement('div'); ashi.className='ashi';
      if(it.machi){
        ashi.innerHTML='<span class="tama"></span>読んでいます…';
      }else if(it.y && it.y.length){
        const nokori=it.y.filter(y=>!y.sumi).length;
        ashi.append(document.createTextNode(`やること${it.y.length}件`+(nokori<it.y.length?`（残り${nokori}）`:'')+'　'));
        const b=document.createElement('button'); b.type='button'; b.textContent='見る';
        b.addEventListener('click',()=>switchTo('yaru'));
        ashi.append(b);
      }else{
        ashi.textContent='メモとして残しました';
      }
      box.append(ashi);
      nagare.append(box);
    });
    nagare.scrollTop=nagare.scrollHeight;
    const n=zenbu().filter(y=>!y.sumi).length;
    kazu.textContent=n; kazu.dataset.zero = n?'0':'1';
  }

  function drawYaru(){
    const all=zenbu();
    const n=all.filter(y=>!y.sumi).length;
    kazu.textContent=n; kazu.dataset.zero = n?'0':'1';
    yaruba.innerHTML='';
    if(!all.length){
      yaruba.innerHTML='<div class="karappo">やることはありません。<br>マイチャットに書けば、ここに並びます。</div>';
      return;
    }
    const kumi=new Map();
    all.forEach(y=>{ if(!kumi.has(y.saki)) kumi.set(y.saki,[]); kumi.get(y.saki).push(y); });
    kumi.forEach((list,saki)=>{
      const box=document.createElement('div'); box.className='kumi';
      const kashira=document.createElement('div'); kashira.className='kashira';
      const b=document.createElement('b'); b.textContent=saki; kashira.append(b);
      const sh=list[0].shubetsu;
      if(sh){const d=document.createElement('span'); d.className='doko'; d.textContent=sh; kashira.append(d)}
      const nan=document.createElement('span'); nan.className='nan';
      nan.textContent=`残り${list.filter(y=>!y.sumi).length}／${list.length}`;
      kashira.append(nan); box.append(kashira);

      list.forEach(y=>{
        const row=document.createElement('div'); row.className='yaru'+(y.sumi?' sumi':'');
        row.innerHTML='<span class="box"></span>';
        const naka=document.createElement('div'); naka.className='naka';
        const mo=document.createElement('div'); mo.className='mo'; mo.textContent=y.mo;
        const moto=document.createElement('div'); moto.className='moto';
        moto.textContent=(y.hizuke?y.hizuke+'　':'')+y.toki+' のメモから';
        naka.append(mo,moto); row.append(naka);
        row.addEventListener('click',()=>{y.sumi=!y.sumi; save(); drawYaru(); drawChat()});
        box.append(row);
      });
      yaruba.append(box);
    });
  }

  function switchTo(which){
    const isYaru = which==='yaru';
    tabYaru.setAttribute('aria-selected', String(isYaru));
    tabMemo.setAttribute('aria-selected', String(!isYaru));
    menYaru.hidden=!isYaru; menMemo.hidden=isYaru;
    if(isYaru) drawYaru();
  }
  tabMemo.addEventListener('click',()=>switchTo('memo'));
  tabYaru.addEventListener('click',()=>switchTo('yaru'));

  function ireru(){
    const s=memo.value.replace(/\s+$/,'');
    if(!s.trim()) return;
    const t=hm(new Date());
    const it={t, s, y:null, machi:true};
    items.push(it);
    memo.value=''; memo.style.height='auto'; okuru.disabled=true;
    save(); drawChat();
    setTimeout(()=>{ it.machi=false; it.y=yomu(s,t); save(); drawChat(); },900);
  }
  memo.addEventListener('input',()=>{
    okuru.disabled=!memo.value.trim();
    memo.style.height='auto'; memo.style.height=Math.min(memo.scrollHeight,190)+'px';
  });
  okuru.addEventListener('click',ireru);

  drawChat();
</script>

</body>
</html>
